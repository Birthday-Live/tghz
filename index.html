<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“水水的互助群聊”展示名单</title>
    <style>
        :root {
            --accent-blue: #0088cc;
            --accent-cyan: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.35);
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(0, 210, 255, 0.5);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 4rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景光圈 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }
        body::before {
            background: #0088cc;
            top: -100px;
            left: -100px;
        }
        body::after {
            background: #7928ca;
            bottom: -100px;
            right: -100px;
        }

        .container {
            max-width: 960px;
            width: 100%;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, #0088cc 0%, #00d2ff 100%);
            box-shadow: 0 12px 30px rgba(0, 136, 204, 0.4);
            margin-bottom: 1.5rem;
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
        }
        .brand-badge:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 400;
        }

        /* 搜索框容器 */
        .search-container {
            position: relative;
            margin-bottom: 3rem;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            pointer-events: none;
            transition: fill 0.3s;
        }

        .search-input {
            width: 100%;
            padding: 1.1rem 3.5rem 1.1rem 3.5rem;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            font-size: 1rem;
            background: rgba(18, 24, 38, 0.6);
            backdrop-filter: blur(16px);
            color: var(--text-main);
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            background: rgba(18, 24, 38, 0.85);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .search-input:focus ~ .search-icon {
            fill: var(--accent-cyan);
        }

        .kbd-hint {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            pointer-events: none;
        }

        /* 网格与卡片 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 1.75rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        /* 悬浮光彩效果 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--card-border-hover);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-body {
            margin-bottom: 1.75rem;
        }

        .group-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.85rem;
            line-height: 1.35;
            letter-spacing: -0.2px;
        }

        .owner-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.18);
            color: var(--accent-cyan);
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
        }

        .owner-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* 按钮与 SVG */
        .join-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .join-btn:hover {
            background: linear-gradient(135deg, #0099e6 0%, #1ab5ff 100%);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.5);
            transform: scale(1.01);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .join-btn:hover .btn-icon {
            transform: translateX(3px) translateY(-1px);
        }

        .status-msg {
            text-align: center;
            color: var(--text-sub);
            grid-column: 1 / -1;
            padding: 4rem 2rem;
            background: rgba(18, 24, 38, 0.4);
            border: 1px dashed var(--card-border);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
        }

        /* 卡片显现动画 */
        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: cardFadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-badge">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.05-.75 4.12-1.79 6.87-2.97 8.25-3.54 3.92-1.63 4.73-1.92 5.26-1.93.12 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.16-.04.25z"/>
            </svg>
        </div>
        <h1>“水水的互助群聊”展示名单awa</h1>
        <p class="subtitle">探索、加入并实时互通各种 Telegram 社区群聊</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索群名称或归属人..." oninput="filterCards()">
        <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span class="kbd-hint">Ctrl K</span>
    </div>

    <div class="grid" id="cardGrid">
        <div class="status-msg">正在拉取最新数据...</div>
    </div>
</div>

<script>
    let telegramData = [];

    // 本地回退备用数据（防护本地 file:// 协议造成的跨域阻断）
    const fallbackData = [
        { "id": 1, "groupName": "水喝千束QAQ", "owner": "水喝千束", "link": "https://t.me/+wVFNNHSZNOhkMzZl" },
        { "id": 2, "groupName": "延和的小家", "owner": "延和酱owo", "link": "https://t.me/+hF1Pz60HbldjYjY5" },
        { "id": 3, "groupName": "来玩喵", "owner": "水喝千束", "link": "https://t.me/+Gn5PJ_X_TtUyZjI1"  }
    ];

    async function loadExternalJSON() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('HTTP 错误');
            telegramData = await response.json();
        } catch (error) {
            console.warn('正在使用静态回退数据渲染 (若需从文件读取请部署至 HTTP 服务器，如果你在网络上看到了此报错，请联系 Telegram@Waterchisato_bot)', error);
            telegramData = fallbackData;
        }
        renderCards(telegramData);
    }

    function renderCards(data) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = `<div class="status-msg">未找到匹配的群聊或归属人</div>`;
            return;
        }

        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.05}s`;
            
            card.innerHTML = `
                <div class="card-body">
                    <h2 class="group-name">${escapeHtml(item.groupName)}</h2>
                    <span class="owner-tag">
                        <svg class="owner-icon" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                        ${escapeHtml(item.owner)}
                    </span>
                </div>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="join-btn">
                    <span>立即加入群聊</span>
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            `;
            grid.appendChild(card);
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = telegramData.filter(item => 
            item.groupName.toLowerCase().includes(query) || 
            item.owner.toLowerCase().includes(query)
        );
        renderCards(filtered);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    // 按下 Ctrl+K / Cmd+K 快速聚焦搜索框
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
    });

    window.addEventListener('DOMContentLoaded', loadExternalJSON);
</script>

</body>
</html>
