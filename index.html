<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ===== 新增：UA 浏览器标识校验层（未改动下方任何原有代码） ===== -->
    <script>
    /* 拦截 微信/QQ 内置浏览器 与 伪造冲突 UA；正常浏览器尝试新开界面跳转 Telegram 机器人 */
    (function () {
        var ua = navigator.userAgent || '';
        var uaL = ua.toLowerCase();
        var blocked = false;

        // 1) 微信 / 企业微信 / QQ 内置浏览器
        if (/wechat|micromessenger|wxwork/i.test(ua)) blocked = true;
        else if (/mqqbrowser|qqbrowser|\bqq\b/i.test(ua)) blocked = true;

        // 2) 伪造 / 互相冲突的 UA
        if (!blocked) {
            var exclusive = ['firefox', 'edg', 'edge', 'opr', 'opera', 'vivaldi', 'yabrowser',
                'samsungbrowser', 'ucbrowser', 'baidu', '2345explorer',
                'sogoumobilebrowser', 'liebaofast', 'quark', 'miuibrowser', 'huaweibrowser'];
            var hits = 0;
            for (var i = 0; i < exclusive.length; i++) {
                if (uaL.indexOf(exclusive[i]) !== -1) hits++;
            }
            if (hits >= 2) blocked = true; // 真实 UA 只会出现其中某一个

            if (!blocked && uaL.indexOf('chrome') !== -1 && uaL.indexOf('firefox') !== -1) blocked = true;

            // Android 版本号写法异常（如 Android16 无空格 / 多个空格）
            if (!blocked && /android\s*1[0-9]/.test(uaL) && !/android 1[0-9]/.test(uaL)) blocked = true;

            // Android 10+ 却堆了一堆浏览器标识 + Safari（正常 Chromium 系 = Chrome+Safari 共 2 个）
            if (!blocked && /android 1[0-9]/.test(uaL)) {
                var markers = ['chrome', 'safari', 'firefox', 'edg', 'opr', 'vivaldi', 'samsungbrowser', 'ucbrowser'];
                var n = 0;
                for (var j = 0; j < markers.length; j++) if (uaL.indexOf(markers[j]) !== -1) n++;
                if (n >= 4) blocked = true;
            }
        }

        var BOT_URL = 'tg://resolve?domain=shuishui_tghzbot';

        // 被拦截：同步检测后立即整页覆盖为明确的"不支持"提示页。
        // 用 document.open/write/close，不依赖 DOMContentLoaded 事件（微信 X5 内核事件不触发会导致白屏）
        if (blocked) {
            document.open();
            document.write('<!DOCTYPE html>' +
                '<html lang="zh-CN"><head><meta charset="UTF-8">' +
                '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                '<title>不支持此浏览器</title></head>' +
                '<body style="margin:0;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;text-align:center;padding:2rem;">' +
                '<div style="font-size:3.2rem;margin-bottom:1rem;">🚫</div>' +
                '<h1 style="font-size:1.4rem;margin:0 0 .6rem;font-weight:700;">不支持此浏览器，请更换浏览器</h1>' +
                '<p style="color:#94a3b8;font-size:.95rem;line-height:1.7;margin:0;">本页面不支持微信 / QQ 内置浏览器，<br>请在 Chrome、Safari、Edge 等浏览器中打开</p>' +
                '</body></html>');
            document.close();
            return;
        }

        // 正常浏览器：尝试新开界面跳转 Telegram 机器人
        function tryOpenBot() {
            var win = null;
            try { win = window.open(BOT_URL, '_blank'); } catch (e) { win = null; }
            if (!win) {
                // 新标签页可能被拦截：页面底部给出手动入口
                var tip = document.createElement('div');
                tip.style.cssText = 'position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:99999;' +
                    'background:rgba(18,24,38,.96);border:1px solid rgba(0,210,255,.45);color:#f1f5f9;' +
                    'padding:.8rem 1.2rem;border-radius:14px;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.5);' +
                    'text-align:center;font-family:-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;';
                tip.innerHTML = '若未自动打开 Telegram，<a href="' + BOT_URL + '" target="_blank" rel="noopener" ' +
                    'style="color:#00d2ff;font-weight:600;text-decoration:none;">点此前往 👉</a>';
                document.body.appendChild(tip);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryOpenBot);
        } else {
            tryOpenBot();
        }
    })();
    </script>
    <!-- ===== 新增层结束，以下为原有代码 ===== -->
    <title>“水水的互助群聊”展示名单</title>
    <style>
        :root {
            --accent-blue: #0088cc;
            --accent-cyan: #00d2ff;
            --accent-purple: #a855f7;
            --accent-glow: rgba(0, 210, 255, 0.35);
            --accent-purple-glow: rgba(168, 85, 247, 0.35);
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(0, 210, 255, 0.5);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景光圈 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }
        body::before { background: #0088cc; top: -50px; left: -50px; }
        body::after { background: #7928ca; bottom: -50px; right: -50px; }

        .container {
            max-width: 960px;
            width: 100%;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, #0088cc 0%, #00d2ff 100%);
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
            margin-bottom: 1.2rem;
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
        }
        .brand-badge:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            fill: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            word-break: break-word;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* 控件控制区 */
        .controls-container {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
            pointer-events: none;
            transition: fill 0.3s;
        }

        .search-input {
            width: 100%;
            padding: 0.95rem 3rem 0.95rem 3rem;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            font-size: 0.95rem;
            background: rgba(18, 24, 38, 0.6);
            backdrop-filter: blur(16px);
            color: var(--text-main);
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input::placeholder { color: #64748b; }

        .search-input:focus {
            border-color: var(--accent-cyan);
            background: rgba(18, 24, 38, 0.85);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .search-input:focus ~ .search-icon { fill: var(--accent-cyan); }

        .kbd-hint {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: monospace;
            pointer-events: none;
        }

        /* 类型分类 Tabs */
        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 0.5rem 1.1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.25) 0%, rgba(0, 210, 255, 0.25) 100%);
            border-color: var(--accent-cyan);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.15);
        }

        /* 网格卡片 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .card.card-pd::before {
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--card-border-hover);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 18px var(--accent-glow);
        }

        .card.card-pd:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 18px var(--accent-purple-glow);
        }

        .card:hover::before { opacity: 1; }

        .card-body { margin-bottom: 1.5rem; }

        .card-header-tags {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .type-badge.qz {
            background: rgba(0, 210, 255, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        .type-badge.pd {
            background: rgba(168, 85, 247, 0.12);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .group-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            line-height: 1.35;
            word-break: break-word;
        }

        .owner-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 30px;
            font-weight: 500;
        }

        .join-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .join-btn.pd-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .join-btn:hover {
            transform: scale(1.01);
            filter: brightness(1.1);
        }

        .btn-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .join-btn:hover .btn-icon {
            transform: translateX(3px);
        }

        .status-msg {
            text-align: center;
            color: var(--text-sub);
            grid-column: 1 / -1;
            padding: 3rem 1.5rem;
            background: rgba(18, 24, 38, 0.4);
            border: 1px dashed var(--card-border);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: cardFadeIn 0.35s ease forwards; }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .kbd-hint { display: none; }
            body { padding: 1.5rem 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-badge">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.05-.75 4.12-1.79 6.87-2.97 8.25-3.54 3.92-1.63 4.73-1.92 5.26-1.93.12 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.16-.04.25z"/>
            </svg>
        </div>
        <h1>“水水的互助群聊”展示名单awa</h1>
        <p class="subtitle">探索、加入并实时互通各种 Telegram 社区群聊与频道</p>
    </header>

    <div class="controls-container">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索名称或归属人..." oninput="filterCards()">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <span class="kbd-hint">Ctrl K</span>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" onclick="setFilter('all', this)">全部</button>
            <button class="tab-btn" onclick="setFilter('qz', this)">💬 群组</button>
            <button class="tab-btn" onclick="setFilter('pd', this)">📢 频道</button>
        </div>
    </div>

    <div class="grid" id="cardGrid">
        <div class="status-msg">正在拉取 JSON 数据...</div>
    </div>
</div>

<script>
    let telegramData = [];
    let currentTypeFilter = 'all';

    // 仅依赖 fetch 从 JSON 加载数据，无任何本地备用数组
    async function loadExternalJSON() {
        const grid = document.getElementById('cardGrid');
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`HTTP 响应错误: ${response.status}`);
            }
            telegramData = await response.json();
            filterCards();
        } catch (error) {
            console.error('JSON 加载失败:', error);
            grid.innerHTML = `<div class="status-msg" style="color: #f87171;">⚠️ 获取 data.json 失败，请检查文件是否存在或部署于 Web 服务器。</div>`;
        }
    }

    function renderCards(data) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = `<div class="status-msg">未找到匹配的数据</div>`;
            return;
        }

        data.forEach((item, index) => {
            const isPd = item.type === 'pd';
            const card = document.createElement('div');
            card.className = `card ${isPd ? 'card-pd' : ''}`;
            card.style.animationDelay = `${index * 0.03}s`;
            
            const typeBadgeHtml = isPd 
                ? `<span class="type-badge pd">📢 频道</span>`
                : `<span class="type-badge qz">💬 群组</span>`;

            const btnText = isPd ? '立即订阅频道' : '立即加入群聊';
            const btnClass = isPd ? 'join-btn pd-btn' : 'join-btn';

            card.innerHTML = `
                <div class="card-body">
                    <div class="card-header-tags">
                        ${typeBadgeHtml}
                    </div>
                    <h2 class="group-name">${escapeHtml(item.groupName || '')}</h2>
                    <span class="owner-tag">
                        👤 ${escapeHtml(item.owner || '未知')}
                    </span>
                </div>
                <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer" class="${btnClass}">
                    <span>${btnText}</span>
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            `;
            grid.appendChild(card);
        });
    }

    function setFilter(type, el) {
        currentTypeFilter = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
        filterCards();
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = telegramData.filter(item => {
            const matchesType = currentTypeFilter === 'all' || item.type === currentTypeFilter;
            const matchesSearch = (item.groupName && item.groupName.toLowerCase().includes(query)) || 
                                  (item.owner && item.owner.toLowerCase().includes(query));
            return matchesType && matchesSearch;
        });
        renderCards(filtered);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    // 按下 Ctrl+K / Cmd+K 快速聚焦搜索框
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
    });

    window.addEventListener('DOMContentLoaded', loadExternalJSON);
</script>

</body>
</html>
